<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Family Chore Tracker – <span id="pageName"></span></title>
  <link rel="stylesheet" href="style.css">
  <!-- Optional Bootstrap CDN for quick styling -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-3">
    <div class="container-fluid">
      <a class="navbar-brand" href="kids.html">Chore Tracker</a>
      <div class="collapse navbar-collapse">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="kids.html">Kids</a></li>
          <li class="nav-item"><a class="nav-link" href="chores.html">Chores</a></li>
          <li class="nav-item"><a class="nav-link" href="rewards.html">Rewards</a></li>
        </ul>
      </div>

  <div class="container">
    <h2 id="pageName"></h2>
    <div id="content"></div>
  </div>

  <script src="app.js"></script>

<!-- Chore List UI -->
<div class="d-flex justify-content-between mb-3">
  <h3>Chore List</h3>
  <button class="btn btn-primary" id="addChoreBtn">Add Chore</button>
</div>
<table class="table table-hover" id="choresTable">
  <thead class="table-dark">
    <tr><th>#</th><th>Kid</th><th>Chore</th><th>Pts</th><th>Done?</th><th>Action</th></tr>
  </thead>
  <tbody></tbody>
</table>

<!-- Modal for adding a chore -->
<div class="modal fade" id="choreModal" tabindex="-1">
  <div class="modal-dialog"><div class="modal-content">
    <div class="modal-header"><h5 class="modal-title">Add Chore</h5>
      <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
    </div>
    <div class="modal-body">
      <input type="text" id="choreKidSelect" class="form-control mb-2" placeholder="Select kid" list="kidsListOptions">
      <datalist id="kidsListOptions"></datalist>
      <input type="text" id="choreDescInput" class="form-control mb-2" placeholder="Chore description">
      <input type="number" id="chorePtsInput" class="form-control" placeholder="Points" min="1">
    </div>
    <div class="modal-footer">
      <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancel</button>
      <button type="button" class="btn btn-primary" id="saveChoreBtn">Save</button>
    </div>
  </div></div>
</div>
