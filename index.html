<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Chore Tracker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <h1>👶 Day Family Chore Tracker</h1>

  <section id="addForm">
    <h2>Give a child a chore</h2>
    <input type="text" id="childName" placeholder="Child’s name" required>
    <input type="text" id="choreDesc" placeholder="Chore description" required>
    <input type="number" id="rewardPts" placeholder="Points" min="1" required>
    <button id="addBtn">Add Chore</button>
  </section>

  <section id="choresList">
    <h2>Chore List</h2>
    <table>
      <thead>
        <tr>
          <th>#</th>
          <th>Child</th>
          <th>Chore</th>
          <th>Points</th>
          <th>Done?</th>
          <th>Action</th>
        </tr>
      </thead>
      <tbody id="choresBody"></tbody>
    </table>
  </section>

  <section id="rewards">
    <h2>Reward Summary</h2>
    <ul id="rewardsList"></ul>
  </section>

  <script src="app.js"></script>
</body>
</html>
